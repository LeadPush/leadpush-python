name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 1.0.0 or 1.1.0b1
        required: true
        type: string
      notes:
        description: Optional release notes; leave blank to generate them
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ inputs.version }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          requested = os.environ["VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[A-Za-z0-9.-]+)?", requested):
              raise SystemExit("Version must look like 1.0.0 or 1.1.0b1")

          with open("pyproject.toml", "rb") as file:
              configured = tomllib.load(file)["project"]["version"]

          if requested != configured:
              raise SystemExit(f"Requested {requested}, but pyproject.toml contains {configured}")
          PY

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists."
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Build distributions
        run: uv build

      - name: Validate distributions
        run: uv run twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          args=("v${VERSION}" --title "v${VERSION}")

          if [[ -n "$NOTES" ]]; then
            args+=(--notes "$NOTES")
          else
            args+=(--generate-notes)
          fi

          if [[ "$VERSION" =~ [A-Za-z] ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"

